name: medicine_reminder
description: "Meditrake - an offline-first medicine reminder and dose tracking app."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  flutter_riverpod: ^3.4.2
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  go_router: ^17.5.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - lib/features/settings/assets/sounds/
    - assets/icon/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"